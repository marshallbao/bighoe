<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学生座次安排 - 大锄头</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (async function checkAuth() {
        try {
          const response = await fetch('/api/auth/verify', {
            method: 'POST',
            credentials: 'same-origin'
          });
          if (!response.ok) throw new Error('Unauthorized');
          const data = await response.json();
          if (data.csrfToken) sessionStorage.setItem('bighoe_csrf_token', data.csrfToken);
        } catch (err) {
          sessionStorage.removeItem('bighoe_csrf_token');
          window.location.href = 'login.html';
        }
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="座次工具栏">
        <header class="brand">
          <div>
            <a class="back-link" href="index.html">返回工具首页</a>
            <p class="eyebrow">Seat Planner</p>
            <h1>学生座次安排</h1>
            <p class="current-class" id="currentClassName">默认班级</p>
          </div>
          <span class="save-state" id="saveState">已自动保存</span>
        </header>

        <section class="panel">
          <div class="panel-title">
            <h2>当前班级</h2>
            <span id="studentCount">0 人</span>
          </div>
          <label class="class-switcher tool-switcher">
            切换班级
            <select id="classSelect"></select>
          </label>
          <a class="link-button" href="students.html">管理班级和学生</a>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>座位计划</h2>
            <button class="primary" id="newPlanBtn" type="button" style="font-size: 12px; padding: 4px 10px;">新建计划</button>
          </div>
          <div class="compact-list" id="planList">
            <p class="empty-copy">暂无座位计划</p>
          </div>
        </section>

        <section class="panel roster-panel">
          <div class="panel-title">
            <h2>未入座</h2>
            <span id="unassignedCount">0 人</span>
          </div>
          <div class="roster" id="roster" aria-label="未入座学生名单"></div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>座位尺寸</h2>
            <span id="seatCount">0 座</span>
          </div>
          <div class="field-grid">
            <label>
              行数
              <input id="rowsInput" type="number" min="1" max="12" value="4" />
            </label>
            <label>
              列数
              <input id="colsInput" type="number" min="1" max="12" value="6" />
            </label>
          </div>
          <div class="button-grid">
            <button id="applySizeBtn" type="button">应用行列</button>
            <button id="addRowBtn" type="button">加一行</button>
            <button id="removeRowBtn" type="button">减一行</button>
            <button id="addColBtn" type="button">加一列</button>
            <button id="removeColBtn" type="button">减一列</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">
            <h2>导入座次</h2>
            <span>覆盖当前座位</span>
          </div>
          <textarea id="seatInput" placeholder="第 1 行：张三，李四，空&#10;第 2 行：王五，空，赵六"></textarea>
          <div class="button-row">
            <button class="primary" id="importSeatsBtn" type="button">导入座次</button>
            <label class="file-button" for="seatFileInput">导入座次文件</label>
            <input id="seatFileInput" type="file" accept=".txt,.csv,.json" />
          </div>
        </section>

        <section class="panel actions">
          <button id="exportBtn" type="button">导出座次</button>
          <button id="clearSeatsBtn" type="button">清空座位</button>
          <button class="danger" id="resetBtn" type="button">重置座位</button>
        </section>
      </aside>

      <section class="workspace" aria-label="座位表">
        <div class="workspace-header">
          <div>
            <p class="eyebrow">Classroom</p>
            <h2>讲台</h2>
            <span id="currentPlanName" style="color: #637083; font-size: 14px; margin-top: 4px; display: block;"></span>
          </div>
          <div class="legend">
            <span><i class="dot filled"></i> 已安排</span>
            <span><i class="dot empty"></i> 空座位</span>
          </div>
        </div>
        <div class="board-wrap">
          <div class="board" id="board"></div>
        </div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="app.js"></script>
  </body>
</html>
