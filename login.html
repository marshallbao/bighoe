<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 大锄头班级管理工具</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --ink: #1d2733;
        --muted: #637083;
        --line: #d9e0ea;
        --accent: #146c6f;
        --accent-strong: #0d5558;
        --gold: #c9821e;
        --danger: #b64242;
        --shadow: 0 18px 50px rgba(27, 39, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: var(--surface);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 32px;
        width: 100%;
        max-width: 420px;
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .logo-wrapper {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        font-weight: bold;
      }

      .logo-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 20px;
      }

      .brand-title {
        font-size: 24px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 4px;
      }

      .brand-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 15px;
        background: var(--surface);
        color: var(--ink);
        transition: 0.16s ease;
        outline: none;
      }

      .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(20, 108, 111, 0.08);
      }

      .form-input::placeholder {
        color: var(--muted);
      }

      .btn {
        width: 100%;
        min-height: 44px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.16s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-strong);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-primary:disabled {
        background: var(--line);
        cursor: not-allowed;
      }

      .error-message {
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 16px;
        color: var(--danger);
        font-size: 14px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .info-message {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 16px;
        color: #166534;
        font-size: 14px;
        display: none;
      }

      .info-message.show {
        display: block;
      }

      .footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      .loading {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="brand">
        <div class="logo-wrapper" id="logoWrapper">
          <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='锄';">
        </div>
        <div class="brand-title">大锄头</div>
        <div class="brand-subtitle">班级管理工具</div>
      </div>

      <div class="info-message" id="infoMessage">
        <strong>提示：</strong>当前系统未启用认证，点击下方按钮直接进入。
      </div>

      <div class="error-message" id="errorMessage">
        认证失败，请检查密钥是否正确
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="apiKey">API 密钥</label>
          <input 
            type="password" 
            id="apiKey" 
            class="form-input" 
            placeholder="请输入 API 密钥"
            autocomplete="off"
          />
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="loading" id="loadingIndicator" style="display: none;"></span>
          登录
        </button>
      </form>

      <div class="footer">
        版本 1.0.0
      </div>
    </div>

    <script>
      const loginForm = document.getElementById('loginForm');
      const apiKeyInput = document.getElementById('apiKey');
      const errorMessage = document.getElementById('errorMessage');
      const infoMessage = document.getElementById('infoMessage');
      const loginBtn = document.getElementById('loginBtn');
      const loadingIndicator = document.getElementById('loadingIndicator');

      async function checkAuthStatus() {
        try {
          const response = await fetch('/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: '' })
          });
          const data = await response.json();

          if (data.authenticated && data.message) {
            infoMessage.classList.add('show');
            apiKeyInput.style.display = 'none';
            document.querySelector('.form-label').style.display = 'none';
          }
        } catch (err) {
          console.error('Failed to check auth status:', err);
        }
      }

      checkAuthStatus();

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const key = apiKeyInput.value.trim();

        errorMessage.classList.remove('show');
        infoMessage.classList.remove('show');
        loginBtn.disabled = true;
        loadingIndicator.style.display = 'inline-block';
        loginBtn.textContent = '';

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key })
          });

          const data = await response.json();

          if (data.success && data.authenticated) {
            sessionStorage.setItem('bighoe_token', data.token);
            sessionStorage.setItem('bighoe_csrf_token', data.csrfToken);
            window.location.href = 'index.html';
          } else {
            errorMessage.textContent = data.error || '认证失败，请检查密钥是否正确';
            errorMessage.classList.add('show');
          }
        } catch (err) {
          errorMessage.textContent = '网络错误，请稍后重试';
          errorMessage.classList.add('show');
        } finally {
          loginBtn.disabled = false;
          loadingIndicator.style.display = 'none';
          loginBtn.textContent = '登录';
        }
      });
    </script>
  </body>
</html>
