<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大锄头 - 园丁工具台</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      async function checkAuth() {
        const token = sessionStorage.getItem('bighoe_token');
        if (!token) {
          window.location.href = 'login.html';
          return;
        }
        
        try {
          const response = await fetch('/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          
          if (!response.ok) {
            sessionStorage.removeItem('bighoe_token');
            sessionStorage.removeItem('bighoe_csrf_token');
            window.location.href = 'login.html';
          }
        } catch (err) {
          sessionStorage.removeItem('bighoe_token');
          sessionStorage.removeItem('bighoe_csrf_token');
          window.location.href = 'login.html';
        }
      }
      checkAuth();
    </script>
  </head>
  <body>
    <main class="home-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">大</div>
        <div class="brand-copy">
          <p class="eyebrow">Big Hoe</p>
          <h1>大锄头</h1>
          <p>给老师准备的班级小工具台</p>
        </div>
        <div class="header-right">
          <label class="class-switcher">
            当前班级
            <select id="classSelect"></select>
          </label>
          <button id="logoutBtn" class="logout-btn">登出</button>
        </div>
      </header>

      <section class="home-grid" aria-label="工具首页">
        <section class="tool-board">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Tools</p>
              <h2>工具入口</h2>
            </div>
            <span id="activeClassMeta">默认班级</span>
          </div>

          <div class="tool-grid">
            <a class="tool-card available" href="students.html">
              <span class="tool-icon">管</span>
              <strong>班级和学生管理</strong>
              <span>统一维护班级、学生名单和学生状态。</span>
            </a>
            <a class="tool-card available" href="seating.html">
              <span class="tool-icon">座</span>
              <strong>学生座次安排</strong>
              <span>选择班级后，使用公共名单拖拽完成排座。</span>
            </a>
            <a class="tool-card available" href="homework.html">
              <span class="tool-icon">作</span>
              <strong>作业提交记录</strong>
              <span>按日记录提交状态，统计未交和按时率。</span>
            </a>
            <a class="tool-card available" href="grades.html">
              <span class="tool-icon">绩</span>
              <strong>成绩记录分析</strong>
              <span>记录考试成绩，生成学生成绩趋势图。</span>
            </a>
          </div>
        </section>

        <aside class="data-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Overview</p>
              <h2>当前班级概览</h2>
            </div>
          </div>

          <div class="overview-list">
            <div class="overview-item">
              <span>班级</span>
              <strong id="classNameMeta">默认班级</strong>
            </div>
            <div class="overview-item">
              <span>学生人数</span>
              <strong id="studentCount">0 人</strong>
            </div>
            <div class="overview-item">
              <span>在读学生</span>
              <strong id="activeStudentCount">0 人</strong>
            </div>
            <div class="overview-item">
              <span>学年/学期</span>
              <strong id="termMeta">未设置</strong>
            </div>
          </div>

          <a class="primary link-button" href="students.html">管理班级和学生</a>
        </aside>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="home.js"></script>
  </body>
</html>
